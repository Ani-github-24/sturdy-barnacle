<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS Playground — Three.js</title>
  <style>
    /* ── Reset ───────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    canvas#three-canvas { display: block; }

    /* ── Overlay ─────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(6, 6, 14, .88);
      backdrop-filter: blur(18px);
      z-index: 10;
      transition: opacity .4s ease;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: #e2e2f0;
      cursor: pointer;
      user-select: none;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    #overlay h1 {
      font-size: 2.6rem; font-weight: 700;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #7eb6ff 0%, #c084fc 50%, #f472b6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: .6rem;
    }
    #overlay p {
      font-size: 1.05rem; color: #9898b8; max-width: 420px; text-align: center;
      line-height: 1.6;
    }
    #overlay .keys {
      margin-top: 1.6rem;
      display: flex; gap: .6rem;
    }
    #overlay .key {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      font-size: .95rem; font-weight: 600;
      background: rgba(255,255,255,.04);
      color: #c4c4e0;
    }
    #overlay .hint {
      margin-top: 2.4rem;
      font-size: .82rem; color: #5a5a7a;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .5; }
      50%      { opacity: 1; }
    }

    /* ── Crosshair ───────────────────────────────────── */
    #crosshair {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity .3s ease;
    }
    #crosshair.visible { opacity: .7; }
    #crosshair .dot {
      position: absolute;
      width: 3px; height: 3px;
      background: #fff;
      border-radius: 50%;
      top: -1.5px; left: -1.5px;
    }
    #crosshair .arm {
      position: absolute;
      background: rgba(220,220,255,.8);
      border-radius: 1px;
    }
    #crosshair .arm.top    { width: 2px; height: 10px; top: -14px; left: -1px; }
    #crosshair .arm.bottom { width: 2px; height: 10px; top: 4px;   left: -1px; }
    #crosshair .arm.left   { width: 10px; height: 2px; top: -1px;  left: -14px; }
    #crosshair .arm.right  { width: 10px; height: 2px; top: -1px;  left: 4px; }

    /* ── Minimap ─────────────────────────────────────── */
    #minimap-wrap {
      position: fixed;
      bottom: 20px; right: 20px;
      width: 180px; height: 180px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s ease;
    }
    #minimap-wrap.visible { opacity: 1; }
    #minimap {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(140,140,200,.25);
      box-shadow: 0 0 20px rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.4);
      background: rgba(10,10,20,.75);
      backdrop-filter: blur(6px);
    }
    #minimap-label {
      position: absolute;
      bottom: -22px; left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: .65rem; font-weight: 600;
      color: rgba(180,180,220,.5);
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── Compass ─────────────────────────────────────── */
    #compass {
      position: fixed;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s ease;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    #compass.visible { opacity: 1; }
    #compass-bar {
      width: 320px; height: 28px;
      overflow: hidden;
      position: relative;
      background: rgba(10,10,20,.55);
      backdrop-filter: blur(8px);
      border-radius: 6px;
      border: 1px solid rgba(140,140,200,.12);
    }
    #compass-strip {
      position: absolute;
      top: 0; height: 100%;
      display: flex; align-items: center;
      white-space: nowrap;
      font-size: .7rem;
      color: rgba(160,160,200,.5);
      transition: left .08s linear;
    }
    #compass-strip .dir {
      display: inline-block;
      width: 80px;
      text-align: center;
      font-weight: 700;
      font-size: .8rem;
    }
    #compass-strip .dir.cardinal { color: rgba(220,220,255,.8); }
    #compass-strip .tick {
      display: inline-block;
      width: 80px;
      text-align: center;
    }
    #compass-center {
      position: absolute;
      top: -3px; left: 50%;
      transform: translateX(-50%);
      width: 2px; height: 34px;
      background: rgba(200,180,255,.5);
      border-radius: 1px;
    }

    /* ── Zone indicator ──────────────────────────────── */
    #zone-indicator {
      position: fixed;
      top: 54px; left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity .5s ease;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 4px;
      background: rgba(10,10,20,.5);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.08);
    }
    #zone-indicator.visible { opacity: 1; }

    /* ── Health & Ammo HUD ───────────────────────────── */
    #hud-bottom {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s ease;
      display: flex;
      gap: 40px;
      align-items: flex-end;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    #hud-bottom.visible { opacity: 1; }

    /* Health */
    .hud-health {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .hud-health .label {
      font-size: .6rem; font-weight: 700;
      color: rgba(180,220,180,.5);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .hud-health .bar-outer {
      width: 180px; height: 10px;
      background: rgba(20,20,30,.7);
      border-radius: 5px;
      border: 1px solid rgba(100,200,100,.15);
      overflow: hidden;
      position: relative;
    }
    .hud-health .bar-inner {
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(90deg, #44cc66, #88ee88);
      transition: width .3s ease, background .3s ease;
      box-shadow: 0 0 8px rgba(68,204,102,.4);
    }
    .hud-health .hp-text {
      position: absolute;
      right: 6px; top: -1px;
      font-size: .55rem; font-weight: 700;
      color: rgba(255,255,255,.7);
      line-height: 12px;
    }

    /* Ammo */
    .hud-ammo {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .hud-ammo .label {
      font-size: .6rem; font-weight: 700;
      color: rgba(180,180,220,.5);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .hud-ammo .count {
      font-size: 1.8rem;
      font-weight: 800;
      color: #d0d0f0;
      line-height: 1;
      letter-spacing: -.02em;
    }
    .hud-ammo .count .sep {
      color: rgba(160,160,200,.35);
      font-weight: 400;
      font-size: 1.2rem;
      margin: 0 2px;
    }
    .hud-ammo .count .reserve {
      color: rgba(160,160,200,.5);
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* ── Hit marker ─────────────────────────────────── */
    #hitmarker {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity .15s ease;
    }
    #hitmarker.show { opacity: 1; }
    #hitmarker .mark {
      position: absolute;
      background: #ff4444;
      border-radius: 1px;
    }
    #hitmarker .mark.tl { width: 8px; height: 2px; top: -6px; left: -12px; transform: rotate(-45deg); }
    #hitmarker .mark.tr { width: 8px; height: 2px; top: -6px; right: -12px; transform: rotate(45deg); }
    #hitmarker .mark.bl { width: 8px; height: 2px; bottom: -6px; left: -12px; transform: rotate(45deg); }
    #hitmarker .mark.br { width: 8px; height: 2px; bottom: -6px; right: -12px; transform: rotate(-45deg); }

    /* ── Damage vignette ─────────────────────────────── */
    #damage-vignette {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity .2s ease;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(180,20,20,.5) 100%);
    }
    #damage-vignette.show { opacity: 1; }

    /* ── Kill feed ───────────────────────────────────── */
    #killfeed {
      position: fixed;
      top: 80px; right: 20px;
      z-index: 6;
      pointer-events: none;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: .72rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }
    .kill-msg {
      padding: 4px 10px;
      background: rgba(10,10,20,.6);
      backdrop-filter: blur(6px);
      border-radius: 4px;
      border: 1px solid rgba(255,80,80,.2);
      color: rgba(255,200,200,.8);
      animation: killfade 2.5s ease forwards;
    }
    @keyframes killfade {
      0%   { opacity: 0; transform: translateX(20px); }
      10%  { opacity: 1; transform: translateX(0); }
      80%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    /* ── Game Over ───────────────────────────────────── */
    #gameover {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10, 2, 2, .85);
      backdrop-filter: blur(12px);
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s ease;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
    }
    #gameover.show { opacity: 1; pointer-events: auto; }
    #gameover h2 {
      font-size: 3rem; font-weight: 800;
      color: #ff4444;
      letter-spacing: -.02em;
      margin-bottom: .4rem;
    }
    #gameover p {
      color: rgba(200,180,180,.6);
      font-size: 1rem;
    }
    #gameover .restart-hint {
      margin-top: 2rem;
      font-size: .8rem;
      color: rgba(200,180,180,.4);
      animation: pulse 2s ease-in-out infinite;
    }

    /* ── Debug info ──────────────────────────────────── */
    #debug {
      position: fixed; bottom: 16px; left: 16px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: .72rem; color: rgba(180,180,220,.45);
      z-index: 5; pointer-events: none;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div id="overlay">
    <h1>FPS Playground</h1>
    <p>Explore 3 zones, engage enemies, and survive. WASD to move, mouse to aim, click to shoot. Watch your ammo and health.</p>
    <div class="keys">
      <div class="key">W</div>
      <div class="key">A</div>
      <div class="key">S</div>
      <div class="key">D</div>
      <div class="key" style="width:auto;padding:0 10px;font-size:.7rem">LMB</div>
      <div class="key" style="width:auto;padding:0 10px;font-size:.7rem">R</div>
    </div>
    <span class="hint">Click anywhere to start</span>
  </div>

  <!-- Game Over -->
  <div id="gameover">
    <h2>YOU DIED</h2>
    <p>The enemies got you.</p>
    <span class="restart-hint">Click to respawn</span>
  </div>

  <!-- Crosshair -->
  <div id="crosshair">
    <div class="dot"></div>
    <div class="arm top"></div>
    <div class="arm bottom"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
  </div>

  <!-- Hit marker -->
  <div id="hitmarker">
    <div class="mark tl"></div>
    <div class="mark tr"></div>
    <div class="mark bl"></div>
    <div class="mark br"></div>
  </div>

  <!-- Damage vignette -->
  <div id="damage-vignette"></div>

  <!-- Compass -->
  <div id="compass">
    <div id="compass-bar">
      <div id="compass-strip"></div>
      <div id="compass-center"></div>
    </div>
  </div>

  <!-- Zone indicator -->
  <div id="zone-indicator"></div>

  <!-- HUD Bottom: Health + Ammo -->
  <div id="hud-bottom">
    <div class="hud-health">
      <span class="label">Health</span>
      <div class="bar-outer">
        <div class="bar-inner" id="hp-bar" style="width:100%"></div>
        <span class="hp-text" id="hp-text">100</span>
      </div>
    </div>
    <div class="hud-ammo">
      <span class="label">Ammo</span>
      <div class="count">
        <span id="ammo-mag">12</span><span class="sep">/</span><span class="reserve" id="ammo-reserve">48</span>
      </div>
    </div>
  </div>

  <!-- Kill feed -->
  <div id="killfeed"></div>

  <!-- Minimap -->
  <div id="minimap-wrap">
    <canvas id="minimap" width="360" height="360"></canvas>
    <div id="minimap-label">MINIMAP</div>
  </div>

  <!-- Debug -->
  <div id="debug"></div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
  /* ================================================================
     CONFIG
  ================================================================ */
  const CFG = {
    moveSpeed:    8,
    sprintMult:   1.8,
    jumpForce:    9,
    gravity:      25,
    playerHeight: 1.7,
    playerRadius: 0.35,
    mouseSens:    0.002,
    groundSize:   260,
    fogNear:      60,
    fogFar:       160,
    // Weapon
    magSize:      12,
    reserveAmmo:  48,
    fireRate:     0.15,   // seconds between shots
    reloadTime:   1.8,    // seconds
    bulletDamage: 35,
    // Player
    maxHealth:    100,
    // Enemy
    enemySpeed:   3,
    enemyDamage:  8,
    enemyFireRate:1.5,    // seconds between enemy shots
    enemyAggroRange: 40,
    enemyHealth:  100,
  };

  /* ================================================================
     ZONE DEFINITIONS
  ================================================================ */
  const ZONES = {
    camp: {
      name: 'Starting Camp',
      center: { x: 0, z: 45 },
      radius: 28,
      palette: {
        primary:  0xd4a44a,
        secondary:0x8b6d2e,
        accent:   0xffcc66,
        emissive: 0xcc8833,
        ground:   '#2a2418',
        groundLine:'rgba(180,140,60,0.15)',
      },
      lightColor: 0xffcc88,
    },
    outpost: {
      name: 'Ruined Outpost',
      center: { x: -55, z: -50 },
      radius: 30,
      palette: {
        primary:  0x4a7a8a,
        secondary:0x3a5a66,
        accent:   0x66cccc,
        emissive: 0x338899,
        ground:   '#1a2228',
        groundLine:'rgba(60,140,160,0.15)',
      },
      lightColor: 0x66bbcc,
    },
    base: {
      name: 'Enemy Base',
      center: { x: 60, z: -55 },
      radius: 30,
      palette: {
        primary:  0x8a3a3a,
        secondary:0x662828,
        accent:   0xff4444,
        emissive: 0xcc2222,
        ground:   '#281a1a',
        groundLine:'rgba(180,60,60,0.15)',
      },
      lightColor: 0xff6644,
    },
  };

  /* ================================================================
     SCENE SETUP
  ================================================================ */
  const renderer = new THREE.WebGLRenderer({ antialias: true, canvas: undefined });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.domElement.id = 'three-canvas';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0c0c1a);
  scene.fog = new THREE.Fog(0x0c0c1a, CFG.fogNear, CFG.fogFar);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 500);

  /* ================================================================
     SKYBOX — procedural gradient hemisphere
  ================================================================ */
  (() => {
    const skyGeo = new THREE.SphereGeometry(220, 32, 32);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor:    { value: new THREE.Color(0x0b0b2a) },
        bottomColor: { value: new THREE.Color(0x141428) },
        horizonColor:{ value: new THREE.Color(0x1e1e4a) },
        offset:      { value: 20 },
        exponent:    { value: 0.5 },
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        uniform vec3  topColor;
        uniform vec3  bottomColor;
        uniform vec3  horizonColor;
        uniform float offset;
        uniform float exponent;
        varying vec3  vWorldPos;
        void main() {
          float h = normalize(vWorldPos + vec3(0.0, offset, 0.0)).y;
          float t = pow(max(h, 0.0), exponent);
          vec3 col = mix(horizonColor, topColor, t);
          col = mix(bottomColor, col, smoothstep(-0.1, 0.15, h));
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));
  })();

  /* ================================================================
     LIGHTING
  ================================================================ */
  const ambient = new THREE.AmbientLight(0x6070a0, 0.35);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffeedd, 0.7);
  dirLight.position.set(30, 50, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 150;
  dirLight.shadow.camera.left = -80;
  dirLight.shadow.camera.right = 80;
  dirLight.shadow.camera.top = 80;
  dirLight.shadow.camera.bottom = -80;
  dirLight.shadow.bias = -0.001;
  scene.add(dirLight);

  const hemiLight = new THREE.HemisphereLight(0x4466aa, 0x223344, 0.3);
  scene.add(hemiLight);

  // Per-zone point lights for atmosphere
  for (const [, zone] of Object.entries(ZONES)) {
    const pl = new THREE.PointLight(zone.lightColor, 0.8, zone.radius * 2.5, 2);
    pl.position.set(zone.center.x, 8, zone.center.z);
    scene.add(pl);
  }

  /* ================================================================
     GROUND
  ================================================================ */
  (() => {
    const S = CFG.groundSize;
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#141420';
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = 'rgba(70, 70, 120, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 512; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(S / 4, S / 4);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(S, S),
      new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
  })();

  // Zone ground patches — colored discs for each zone
  for (const [, zone] of Object.entries(ZONES)) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = zone.palette.ground;
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = zone.palette.groundLine;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 256; i += 16) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(zone.radius / 3, zone.radius / 3);

    const patch = new THREE.Mesh(
      new THREE.CircleGeometry(zone.radius, 48),
      new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0.05 })
    );
    patch.rotation.x = -Math.PI / 2;
    patch.position.set(zone.center.x, 0.02, zone.center.z);
    patch.receiveShadow = true;
    scene.add(patch);
  }

  /* ================================================================
     OBSTACLES SYSTEM
  ================================================================ */
  const obstacles = [];

  function addBox(w, h, d, x, y, z, color, emissive, emissiveInt = 0.3) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: emissive || 0x000000,
      emissiveIntensity: emissiveInt, roughness: 0.55, metalness: 0.3,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: emissive || color, transparent: true, opacity: 0.3 })
    );
    edges.position.copy(mesh.position);
    scene.add(edges);

    const bb = new THREE.Box3().setFromObject(mesh);
    obstacles.push({ mesh, box: bb });

  }

  function addCylinder(rTop, rBot, h, segs, x, y, z, color, emissive, emissiveInt = 0.3) {
    const geo = new THREE.CylinderGeometry(rTop, rBot, h, segs);
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: emissive || 0x000000,
      emissiveIntensity: emissiveInt, roughness: 0.55, metalness: 0.3,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: emissive || color, transparent: true, opacity: 0.25 })
    );
    edges.position.copy(mesh.position);
    scene.add(edges);

    const bb = new THREE.Box3().setFromObject(mesh);
    obstacles.push({ mesh, box: bb });
    return mesh;
  }

  function addCone(r, h, segs, x, y, z, color, emissive) {
    const geo = new THREE.ConeGeometry(r, h, segs);
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: emissive || 0x000000,
      emissiveIntensity: 0.2, roughness: 0.6, metalness: 0.1,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    const bb = new THREE.Box3().setFromObject(mesh);
    obstacles.push({ mesh, box: bb });
    return mesh;

  (() => {
    function pathBollards(x1, z1, x2, z2, count, color, emissive) {
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const x = x1 + (x2 - x1) * t;
        const z = z1 + (z2 - z1) * t;
        const dx = -(z2 - z1), dz = (x2 - x1);
        const len = Math.sqrt(dx * dx + dz * dz) || 1;
        const side = (i % 2 === 0) ? 2.5 : -2.5;
        addCylinder(0.15, 0.2, 0.7, 6,
          x + (dx / len) * side, 0.35, z + (dz / len) * side,
          color, emissive, 0.6);
      }
    }

      ZONES.camp.center.x - 12, ZONES.camp.center.z - 8,
      ZONES.outpost.center.x + 12, ZONES.outpost.center.z + 15,
      14, 0x5a6a5a, 0x88aa88

  const weapon = {
    magAmmo:    CFG.magSize,
    reserve:    CFG.reserveAmmo,
    lastFire:   0,
    reloading:  false,
    reloadEnd:  0,
    recoilAnim: 0,     // 0..1 recoil animation progress
    kickback:   0,
  };

  const raycaster = new THREE.Raycaster();
  let flashTimer = 0;

  function canFire() {
    return !weapon.reloading && weapon.magAmmo > 0 &&
           (performance.now() / 1000 - weapon.lastFire) >= CFG.fireRate;
  }

  function startReload() {
    if (weapon.reloading || weapon.reserve <= 0 || weapon.magAmmo >= CFG.magSize) return;
    weapon.reloading = true;
    weapon.reloadEnd = performance.now() / 1000 + CFG.reloadTime;
  }

  function fireWeapon() {
    if (!canFire()) return;
    weapon.magAmmo--;
    weapon.lastFire = performance.now() / 1000;
    weapon.kickback = 1;
    flashTimer = 0.06; // seconds to show flash

    // Muzzle flash on
    flashMat.opacity = 1;
    muzzleFlash.children.forEach(c => { if (c.material) c.material.opacity = 1; });
    muzzleLight.intensity = 3;

    // Raycast from camera center
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const enemyMeshes = enemies.filter(e => e.alive).map(e => e.group);
    const intersects = raycaster.intersectObjects(enemyMeshes, true);

    if (intersects.length > 0) {
      // Find which enemy was hit
      let hitObj = intersects[0].object;
      for (const enemy of enemies) {
        if (!enemy.alive) continue;
        let check = hitObj;
        while (check) {
          if (check === enemy.group) {
            damageEnemy(enemy, CFG.bulletDamage);
            showHitmarker();
            break;
          }
          check = check.parent;
        }
      }
    }

    // Auto-reload when empty
    if (weapon.magAmmo <= 0 && weapon.reserve > 0) {
      setTimeout(() => startReload(), 300);
    }

    updateAmmoHUD();
  }

  function updateEnemyHP(enemy) {
    const ctx = enemy.hpCanvas.getContext('2d');
    ctx.clearRect(0, 0, 128, 16);
    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 128, 16);
    // Bar
    const pct = Math.max(0, enemy.health / enemy.maxHealth);
    const r = Math.round(255 * (1 - pct));
    const g = Math.round(200 * pct);
    ctx.fillStyle = `rgb(${r},${g},40)`;
    ctx.fillRect(2, 2, 124 * pct, 12);
    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(1, 1, 126, 14);
    enemy.hpTex.needsUpdate = true;
  }

  function damageEnemy(enemy, dmg) {
    if (!enemy.alive) return;
    enemy.health -= dmg;
    if (enemy.health <= 0) {
      enemy.health = 0;
      enemy.alive = false;
      updateEnemyHP(enemy);
      // Death animation: scale down + fall
      const deathAnim = () => {
        if (enemy.group.scale.y > 0.05) {
          enemy.group.scale.y *= 0.88;
          enemy.group.position.y -= 0.02;
          requestAnimationFrame(deathAnim);
        } else {
          scene.remove(enemy.group);
        }
      };
      deathAnim();
      addKillFeed(enemy.name);
    } else {
      updateEnemyHP(enemy);
      // Flash red on hit
      enemy.group.children.forEach(c => {
        if (c.material && c.material.emissive) {
          const orig = c.material.emissiveIntensity;
          c.material.emissiveIntensity = 2;
          setTimeout(() => { c.material.emissiveIntensity = orig; }, 100);
        }
      });
    }
  }

  function updateEnemies(dt) {
    const now = performance.now() / 1000;
    for (const enemy of enemies) {
      if (!enemy.alive) continue;

      const dx = player.pos.x - enemy.group.position.x;
      const dz = player.pos.z - enemy.group.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);

      // Face player
      const angle = Math.atan2(dx, dz);
      enemy.group.rotation.y = angle;

      // Aggro check
      enemy.aggro = dist < CFG.enemyAggroRange;

      if (enemy.aggro && playerHealth > 0) {
        // Move toward player (stop at ~6 units)
        if (dist > 6) {
          const speed = CFG.enemySpeed * dt;
          enemy.group.position.x += (dx / dist) * speed;
          enemy.group.position.z += (dz / dist) * speed;
        }

        // Bob animation
        enemy.group.position.y = Math.sin(now * 4) * 0.05;

        // Shoot at player
        if (now - enemy.lastFire >= CFG.enemyFireRate && dist < CFG.enemyAggroRange) {
          enemy.lastFire = now + Math.random() * 0.3; // slight randomness
          damagePlayer(CFG.enemyDamage);

          // Show enemy muzzle flash
          enemy.eMuzzle.material.opacity = 1;
          enemy.muzzleTimer = 0.08;
        }
      }

      // Enemy muzzle flash fade
      if (enemy.muzzleTimer > 0) {
        enemy.muzzleTimer -= dt;
        if (enemy.muzzleTimer <= 0) {
          enemy.eMuzzle.material.opacity = 0;
        }
      }
    }
  }

  // Spawn enemies in each zone (not in camp — that's the safe zone)
  createEnemy(ZONES.outpost.center.x - 5, ZONES.outpost.center.z + 5, 'Outpost Sentry');
  createEnemy(ZONES.outpost.center.x + 8, ZONES.outpost.center.z - 6, 'Outpost Lurker');
  createEnemy(ZONES.base.center.x - 4,    ZONES.base.center.z - 2, 'Base Guard');
  createEnemy(ZONES.base.center.x + 6,    ZONES.base.center.z + 5, 'Base Patrol');
  // One wanderer between outpost and base
  createEnemy(5, -20, 'Wilderness Scout');

  /* ================================================================
     PLAYER HEALTH
  ================================================================ */
  let playerHealth = CFG.maxHealth;

  const hpBar     = document.getElementById('hp-bar');
  const hpText    = document.getElementById('hp-text');
  const ammoMagEl = document.getElementById('ammo-mag');
  const ammoResEl = document.getElementById('ammo-reserve');
  const hitmarkerEl = document.getElementById('hitmarker');
  const vignetteEl  = document.getElementById('damage-vignette');
  const killfeedEl  = document.getElementById('killfeed');
  const gameoverEl  = document.getElementById('gameover');

  function updateHealthHUD() {
    const pct = Math.max(0, playerHealth / CFG.maxHealth) * 100;
    hpBar.style.width = pct + '%';
    hpText.textContent = Math.ceil(playerHealth);
    if (pct > 60) {
      hpBar.style.background = 'linear-gradient(90deg, #44cc66, #88ee88)';
      hpBar.style.boxShadow = '0 0 8px rgba(68,204,102,.4)';
    } else if (pct > 25) {
      hpBar.style.background = 'linear-gradient(90deg, #ccaa33, #eedd44)';
      hpBar.style.boxShadow = '0 0 8px rgba(204,170,51,.4)';
    } else {
      hpBar.style.background = 'linear-gradient(90deg, #cc3333, #ee5555)';
      hpBar.style.boxShadow = '0 0 8px rgba(204,51,51,.4)';
    }
  }

  function updateAmmoHUD() {
    ammoMagEl.textContent = weapon.magAmmo;
    ammoResEl.textContent = weapon.reserve;
    ammoMagEl.style.color = weapon.magAmmo <= 3 ? '#ff6666' : '#d0d0f0';
  }

  function damagePlayer(dmg) {
    if (playerHealth <= 0) return;
    playerHealth -= dmg;
    updateHealthHUD();

    // Damage vignette flash
    vignetteEl.classList.add('show');
    setTimeout(() => vignetteEl.classList.remove('show'), 250);

    if (playerHealth <= 0) {
      playerHealth = 0;
      updateHealthHUD();
      onPlayerDeath();
    }
  }

  function showHitmarker() {
    hitmarkerEl.classList.add('show');
    setTimeout(() => hitmarkerEl.classList.remove('show'), 150);
  }

  function addKillFeed(name) {
    const msg = document.createElement('div');
    msg.className = 'kill-msg';
    msg.textContent = `☠ ${name} eliminated`;
    killfeedEl.appendChild(msg);
    setTimeout(() => msg.remove(), 3000);
  }

  function onPlayerDeath() {
    gameoverEl.classList.add('show');
    // Exit pointer lock
    if (document.pointerLockElement) document.exitPointerLock();
  }

  function respawnPlayer() {
    playerHealth = CFG.maxHealth;
    weapon.magAmmo = CFG.magSize;
    weapon.reserve = CFG.reserveAmmo;
    weapon.reloading = false;
    player.pos.set(ZONES.camp.center.x, CFG.playerHeight, ZONES.camp.center.z + 8);
    player.vel.set(0, 0, 0);
    player.euler.set(0, 0, 0, 'YXZ');
    camera.quaternion.setFromEuler(player.euler);
    updateHealthHUD();
    updateAmmoHUD();
    gameoverEl.classList.remove('show');

    // Respawn dead enemies
    for (const enemy of enemies) {
      if (!enemy.alive) {
        enemy.alive = true;
        enemy.health = enemy.maxHealth;
        enemy.group.scale.set(1, 1, 1);
        enemy.group.position.set(enemy.spawnX, 0, enemy.spawnZ);
        updateEnemyHP(enemy);
        scene.add(enemy.group);
      }
    }
  }

  gameoverEl.addEventListener('click', () => {
    respawnPlayer();
    renderer.domElement.requestPointerLock();
  });

  // Initialize HUD
  updateHealthHUD();
  updateAmmoHUD();

  /* ================================================================
     PLAYER / CAMERA
  ================================================================ */
  const player = {
    pos: new THREE.Vector3(
      ZONES.camp.center.x,
      CFG.playerHeight,
      ZONES.camp.center.z + 8
    ),
    vel: new THREE.Vector3(),
    onGround: true,
    euler: new THREE.Euler(0, 0, 0, 'YXZ'),
  };
  camera.position.copy(player.pos);

  /* ================================================================
     INPUT
  ================================================================ */
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && locked) startReload();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  const overlay    = document.getElementById('overlay');
  const crosshair  = document.getElementById('crosshair');
  const minimapWrap = document.getElementById('minimap-wrap');
  const compassEl  = document.getElementById('compass');
  const zoneIndEl  = document.getElementById('zone-indicator');
  const hudBottom  = document.getElementById('hud-bottom');
  let locked = false;

  overlay.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    locked = !!document.pointerLockElement;
    overlay.classList.toggle('hidden', locked);
    crosshair.classList.toggle('visible', locked);
    minimapWrap.classList.toggle('visible', locked);
    compassEl.classList.toggle('visible', locked);
    zoneIndEl.classList.toggle('visible', locked);
    hudBottom.classList.toggle('visible', locked);
  });

  document.addEventListener('mousemove', e => {
    if (!locked) return;
    player.euler.y -= e.movementX * CFG.mouseSens;
    player.euler.x -= e.movementY * CFG.mouseSens;
    player.euler.x = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, player.euler.x));
    camera.quaternion.setFromEuler(player.euler);
  });

  // Shoot on click
  document.addEventListener('mousedown', e => {
    if (!locked || e.button !== 0 || playerHealth <= 0) return;
    fireWeapon();
  });

  /* ================================================================
     COLLISION HELPERS
  ================================================================ */
  const _playerBox = new THREE.Box3();

  function getPlayerBox(pos) {
    const r = CFG.playerRadius;
    _playerBox.min.set(pos.x - r, pos.y - CFG.playerHeight, pos.z - r);
    _playerBox.max.set(pos.x + r, pos.y + 0.1, pos.z + r);
    return _playerBox;
  }

  function collidesAny(pos) {
    const pb = getPlayerBox(pos);
    for (const obs of obstacles) {
      if (pb.intersectsBox(obs.box)) return true;
    }
    return false;
  }

  /* ================================================================
     MINIMAP
  ================================================================ */
  const minimapCanvas = document.getElementById('minimap');
  const mCtx = minimapCanvas.getContext('2d');
  const MAP_SIZE = 360;
  const MAP_WORLD = 220;

  function drawMinimap() {
    const px = player.pos.x, pz = player.pos.z;
    const scale = MAP_SIZE / MAP_WORLD;

    mCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);

    mCtx.save();
    mCtx.beginPath();
    mCtx.arc(MAP_SIZE/2, MAP_SIZE/2, MAP_SIZE/2 - 2, 0, Math.PI*2);
    mCtx.clip();

    mCtx.fillStyle = 'rgba(10,10,22,0.85)';
    mCtx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

    mCtx.translate(MAP_SIZE/2, MAP_SIZE/2);

    // Zone areas
    for (const [key, zone] of Object.entries(ZONES)) {
      const sx = (zone.center.x - px) * scale;
      const sz = (zone.center.z - pz) * scale;
      mCtx.beginPath();
      mCtx.arc(sx, sz, zone.radius * scale, 0, Math.PI * 2);
      const colors = {
        camp:    'rgba(200,160,60,0.12)',
        outpost: 'rgba(60,160,180,0.12)',
        base:    'rgba(180,50,50,0.12)',
      };
      mCtx.fillStyle = colors[key] || 'rgba(100,100,100,0.1)';
      mCtx.fill();

      const borderColors = {
        camp:    'rgba(200,160,60,0.3)',
        outpost: 'rgba(60,160,180,0.3)',
        base:    'rgba(180,50,50,0.3)',
      };
      mCtx.strokeStyle = borderColors[key] || 'rgba(100,100,100,0.2)';
      mCtx.lineWidth = 1.5;
      mCtx.stroke();

      mCtx.fillStyle = borderColors[key].replace('0.3', '0.7');
      mCtx.font = 'bold 10px Inter, Segoe UI, sans-serif';
      mCtx.textAlign = 'center';
      mCtx.fillText(zone.name.toUpperCase(), sx, sz + 4);
    }

    // Obstacles as dots
    for (const obs of obstacles) {
      const ox = (obs.mesh.position.x - px) * scale;
      const oz = (obs.mesh.position.z - pz) * scale;
      if (Math.abs(ox) > MAP_SIZE/2 || Math.abs(oz) > MAP_SIZE/2) continue;
      const bw = (obs.box.max.x - obs.box.min.x) * scale;
      const bd = (obs.box.max.z - obs.box.min.z) * scale;
      mCtx.fillStyle = 'rgba(100,100,150,0.35)';
      mCtx.fillRect(ox - bw/2, oz - bd/2, Math.max(bw, 2), Math.max(bd, 2));
    }

    // Enemies as red dots
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const ex = (enemy.group.position.x - px) * scale;
      const ez = (enemy.group.position.z - pz) * scale;
      if (Math.abs(ex) > MAP_SIZE/2 || Math.abs(ez) > MAP_SIZE/2) continue;
      mCtx.beginPath();
      mCtx.arc(ex, ez, 4, 0, Math.PI * 2);
      mCtx.fillStyle = enemy.aggro ? 'rgba(255,60,60,0.9)' : 'rgba(255,100,100,0.5)';
      mCtx.fill();
    }

    // Player arrow
    mCtx.save();
    mCtx.rotate(-player.euler.y + Math.PI);
    mCtx.beginPath();
    mCtx.moveTo(0, -8);
    mCtx.lineTo(-5, 6);
    mCtx.lineTo(0, 3);
    mCtx.lineTo(5, 6);
    mCtx.closePath();
    mCtx.fillStyle = '#ddd';
    mCtx.fill();
    mCtx.strokeStyle = 'rgba(255,255,255,0.6)';
    mCtx.lineWidth = 1;
    mCtx.stroke();
    mCtx.restore();

    mCtx.restore(); // un-clip

    mCtx.beginPath();
    mCtx.arc(MAP_SIZE/2, MAP_SIZE/2, MAP_SIZE/2 - 2, 0, Math.PI*2);
    mCtx.strokeStyle = 'rgba(140,140,200,0.2)';
    mCtx.lineWidth = 2;
    mCtx.stroke();

    mCtx.fillStyle = 'rgba(255,180,180,0.7)';
    mCtx.font = 'bold 12px Inter, Segoe UI, sans-serif';
    mCtx.textAlign = 'center';
    mCtx.fillText('N', MAP_SIZE/2, 14);
  }

  /* ================================================================
     COMPASS
  ================================================================ */
  const compassStrip = document.getElementById('compass-strip');
  const compassDirs = ['N','NE','E','SE','S','SW','W','NW'];

  function updateCompass() {
    let heading = THREE.MathUtils.radToDeg(player.euler.y);
    heading = ((heading % 360) + 360) % 360;

    let html = '';
    for (let deg = -180; deg <= 540; deg += 10) {
      const normalized = ((deg % 360) + 360) % 360;
      const dirIdx = Math.round(normalized / 45) % 8;
      const isCardinal = normalized % 90 === 0;

      if (normalized % 45 === 0) {
        const cls = isCardinal ? 'dir cardinal' : 'dir';
        html += `<span class="${cls}" style="width:40px">${compassDirs[dirIdx]}</span>`;
      } else {
        const label = Math.round(normalized) + '°';
        html += `<span class="tick" style="width:40px;font-size:.55rem;opacity:.3">${(normalized % 30 === 0) ? label : '·'}</span>`;
      }
    }
    compassStrip.innerHTML = html;

    const px = -(heading / 10) * 40 + 160 + 40 * 18;
    compassStrip.style.left = px + 'px';
  }

  /* ================================================================
     ZONE DETECTION
  ================================================================ */
  let currentZone = '';
  function detectZone() {
    let closest = '', closestDist = Infinity;
    for (const [key, zone] of Object.entries(ZONES)) {
      const dx = player.pos.x - zone.center.x;
      const dz = player.pos.z - zone.center.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      if (dist < zone.radius && dist < closestDist) {
        closest = key;
        closestDist = dist;
      }
    }
    if (closest !== currentZone) {
      currentZone = closest;
      if (closest) {
        const zone = ZONES[closest];
        const c = new THREE.Color(zone.palette.accent);
        zoneIndEl.style.color = `#${c.getHexString()}`;
        zoneIndEl.style.borderColor = `rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.25)`;
        zoneIndEl.textContent = zone.name;
      } else {
        zoneIndEl.style.color = 'rgba(180,180,220,.5)';
        zoneIndEl.style.borderColor = 'rgba(255,255,255,.08)';
        zoneIndEl.textContent = 'Wilderness';
      }
    }
  }

  /* ================================================================
     HEAD‑BOB & WEAPON SWAY
  ================================================================ */
  let bobTimer = 0;
  const bobFreq = 11;
  const bobAmpY = 0.035;
  const bobAmpX = 0.018;

  const weaponRestPos = weaponGroup.position.clone();

  /* ================================================================
     GAME LOOP
  ================================================================ */
  const clock = new THREE.Clock();
  const _forward = new THREE.Vector3();
  const _right   = new THREE.Vector3();
  const _tryPos  = new THREE.Vector3();
  const debugEl  = document.getElementById('debug');
  let frameCount = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    const now = performance.now() / 1000;
    frameCount++;

    // Update enemies regardless of lock (so they can still aggro)
    updateEnemies(dt);

    if (locked && playerHealth > 0) {
      /* ── Determine move direction ─────────────────── */
      camera.getWorldDirection(_forward);
      _forward.y = 0; _forward.normalize();
      _right.crossVectors(_forward, camera.up).normalize();

      const sprint = keys['ShiftLeft'] ? CFG.sprintMult : 1;
      const speed  = CFG.moveSpeed * sprint;
      const move   = new THREE.Vector3();

      if (keys['KeyW'] || keys['ArrowUp'])    move.add(_forward);
      if (keys['KeyS'] || keys['ArrowDown'])  move.sub(_forward);
      if (keys['KeyA'] || keys['ArrowLeft'])  move.sub(_right);
      if (keys['KeyD'] || keys['ArrowRight']) move.add(_right);

      if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);

      /* ── Gravity & jump ───────────────────────────── */
      if (keys['Space'] && player.onGround) {
        player.vel.y = CFG.jumpForce;
        player.onGround = false;
      }
      player.vel.y -= CFG.gravity * dt;

      /* ── Slide‑based collision (axis‑separated) ───── */
      _tryPos.copy(player.pos);
      _tryPos.x += move.x * dt;
      if (!collidesAny(_tryPos)) player.pos.x = _tryPos.x;

      _tryPos.copy(player.pos);
      _tryPos.z += move.z * dt;
      if (!collidesAny(_tryPos)) player.pos.z = _tryPos.z;

      _tryPos.copy(player.pos);
      _tryPos.y += player.vel.y * dt;
      if (!collidesAny(_tryPos) && _tryPos.y >= CFG.playerHeight) {
        player.pos.y = _tryPos.y;
      } else {
        if (player.vel.y < 0) {
          player.pos.y = Math.max(player.pos.y, CFG.playerHeight);
          player.onGround = true;
        }
        player.vel.y = 0;
      }

      if (player.pos.y < CFG.playerHeight) {
        player.pos.y = CFG.playerHeight;
        player.vel.y = 0;
        player.onGround = true;
      }

      const half = CFG.groundSize / 2 - 1;
      player.pos.x = THREE.MathUtils.clamp(player.pos.x, -half, half);
      player.pos.z = THREE.MathUtils.clamp(player.pos.z, -half, half);

      /* ── Head bob ─────────────────────────────────── */
      const isMoving = move.lengthSq() > 0.01 && player.onGround;
      if (isMoving) {
        bobTimer += dt * bobFreq * sprint;
        camera.position.copy(player.pos);
        camera.position.y += Math.sin(bobTimer) * bobAmpY;
        camera.position.x += Math.cos(bobTimer * 0.5) * bobAmpX;
      } else {
        bobTimer = 0;
        camera.position.copy(player.pos);
      }

      /* ── Weapon animation ─────────────────────────── */
      // Kickback recoil
      if (weapon.kickback > 0) {
        weapon.kickback -= dt * 12;
        if (weapon.kickback < 0) weapon.kickback = 0;
      }
      const kick = weapon.kickback * 0.03;
      weaponGroup.position.z = weaponRestPos.z + kick;
      weaponGroup.rotation.x = -kick * 3;

      // Weapon sway from movement
      if (isMoving) {
        weaponGroup.position.y = weaponRestPos.y + Math.sin(bobTimer * 1.1) * 0.008;
        weaponGroup.position.x = weaponRestPos.x + Math.cos(bobTimer * 0.6) * 0.005;
      } else {
        // Idle sway
        weaponGroup.position.y = weaponRestPos.y + Math.sin(now * 1.5) * 0.003;
        weaponGroup.position.x = weaponRestPos.x + Math.cos(now * 1.2) * 0.002;
      }

      // Reload animation (lower weapon)
      if (weapon.reloading) {
        weaponGroup.position.y = weaponRestPos.y - 0.15;
        if (now >= weapon.reloadEnd) {
          weapon.reloading = false;
          const needed = CFG.magSize - weapon.magAmmo;
          const available = Math.min(needed, weapon.reserve);
          weapon.magAmmo += available;
          weapon.reserve -= available;
          updateAmmoHUD();
        }
      }

      /* ── Muzzle flash fade ────────────────────────── */
      if (flashTimer > 0) {
        flashTimer -= dt;
        if (flashTimer <= 0) {
          flashMat.opacity = 0;
          muzzleFlash.children.forEach(c => { if (c.material) c.material.opacity = 0; });
          muzzleLight.intensity = 0;
        }
      }

      /* ── HUD updates (throttled) ──────────────────── */
      if (frameCount % 3 === 0) {
        drawMinimap();
        updateCompass();
        detectZone();
      }

      /* ── Debug HUD ────────────────────────────────── */
      const aliveCount = enemies.filter(e => e.alive).length;
      debugEl.innerHTML =
        `pos  ${player.pos.x.toFixed(1)}, ${player.pos.y.toFixed(1)}, ${player.pos.z.toFixed(1)}<br>` +
        `vel  ${move.length().toFixed(1)} u/s` +
        (sprint > 1 ? '  ⚡ sprint' : '') +
        (!player.onGround ? '  ↑ airborne' : '') +
        `<br>zone  ${currentZone ? ZONES[currentZone].name : 'Wilderness'}` +
        `<br>enemies  ${aliveCount}/${enemies.length}` +
        (weapon.reloading ? '<br><span style="color:rgba(255,200,100,.6)">RELOADING...</span>' : '');
    }

    renderer.render(scene, camera);
  }

  animate();

  /* ================================================================
     RESIZE
  ================================================================ */
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>
</body>
</html>
